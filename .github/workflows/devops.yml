name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  deploy-main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Main Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 13.232.203.181
          username: ec2-user
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            set -e

            echo "Deploying application from main branch..."
            cd /home/ec2-user/my-repo-project2/aws-ec2-cicd-project1

            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            echo "2. Checking deployed commit..."
            git rev-parse HEAD
            git log -1 --oneline

            echo "3. Installing dependencies..."
            npm install

            echo "4. Restarting PM2 application..."
            if pm2 describe my-node-app > /dev/null 2>&1; then
              APP_ENV=PROD pm2 restart my-node-app --update-env
            else
              APP_ENV=PROD pm2 start app.js --name my-node-app --update-env
            fi

            pm2 save
            echo "Main deployment successful!"